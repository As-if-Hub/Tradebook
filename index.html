<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="inter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191C" id="tc">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Trade Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme=dark]{
  --bg:#17191C; --s1:#1F2226; --s2:#272B30; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.2);
  --ink:#E6E8EA; --ink2:#9AA1A9; --acc:#7DBBAA; --on-acc:#0F211C;
  --gain:#86C9A6; --loss:#E39A88; --warn:#D9B76E;
  --gain-bg:rgba(134,201,166,.14); --loss-bg:rgba(227,154,136,.14); --warn-bg:rgba(217,183,110,.14);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#F6F5F2; --s1:#FFFFFF; --s2:#F0EEEA; --line:rgba(20,25,30,.1); --line2:rgba(20,25,30,.22);
  --ink:#22272B; --ink2:#62696F; --acc:#2C7A6D; --on-acc:#FFFFFF;
  --gain:#23805A; --loss:#B4513D; --warn:#8F6410;
  --gain-bg:rgba(35,128,90,.11); --loss-bg:rgba(180,81,61,.11); --warn-bg:rgba(180,120,20,.13);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  [data-theme=auto]{
    --bg:#F6F5F2; --s1:#FFFFFF; --s2:#F0EEEA; --line:rgba(20,25,30,.1); --line2:rgba(20,25,30,.22);
    --ink:#22272B; --ink2:#62696F; --acc:#2C7A6D; --on-acc:#FFFFFF;
    --gain:#23805A; --loss:#B4513D; --warn:#8F6410;
    --gain-bg:rgba(35,128,90,.11); --loss-bg:rgba(180,81,61,.11); --warn-bg:rgba(180,120,20,.13);
    color-scheme:light;
  }
}
html{--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-font=nunito]{--font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-font=manrope]{--font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body,button,input,select,textarea{font-family:var(--font)}
body{font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
button{cursor:pointer}
h1,h2,h3{font-weight:650;line-height:1.2}
.muted{color:var(--ink2)}
.gain{color:var(--gain)} .loss{color:var(--loss)}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:22px}
.feed{font-size:13px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink2);display:inline-block;flex:none}
.dot.ok{background:var(--gain)} .dot.warn{background:var(--warn)} .dot.old{background:var(--loss)}
.subtitle{font-size:20px;font-weight:650}
.subhead{display:flex;align-items:center;gap:6px}

/* buttons and form controls */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:15px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--acc);font-size:14px;font-weight:600;padding:6px 4px;min-height:36px}
.link.danger{color:var(--loss)}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px}
input,select,textarea{width:100%;font-size:16px;font-weight:500;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink2);opacity:.75}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.err{color:var(--loss);font-weight:500;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg label{margin:0;position:relative;font-size:15px;color:inherit}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg span{display:block;text-align:center;padding:11px;font-weight:600;color:var(--ink2)}
.seg input:checked+span{background:var(--acc);color:var(--on-acc)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;padding:2px 9px;background:var(--s2);border-radius:999px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chipcheck{margin:0;position:relative;font-size:14px;color:inherit}
.chipcheck input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chipcheck span{display:block;padding:7px 12px;border:1px solid var(--line2);border-radius:999px}
.chipcheck input:checked+span{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chipcheck input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.tog{display:flex;margin:4px 16px 0;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.tog button{flex:1;min-height:40px;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:600}
.tog button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin:12px 16px;overflow:hidden}
.sumcard{padding:16px 18px}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{display:block;font-size:13px;color:var(--ink2)}
.big{display:block;font-size:26px;font-weight:650;line-height:1.15;margin-top:2px}
.sumnote{font-size:13px;color:var(--ink2);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

/* positions: collapsed row with a price bar, expandable */
.pos{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin:10px 16px;overflow:hidden}
.pos.hot-loss{border-color:var(--loss)} .pos.hot-gain{border-color:var(--gain)} .pos.hot-warn{border-color:var(--warn)}
.pos-h{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:14px 16px}
.pos-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sym{display:block;font-size:19px;font-weight:650;line-height:1.15}
.sub{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:3px}
.plr{text-align:right;flex:none}
.plr b{display:block;font-size:19px;font-weight:650;line-height:1.15}
.plr small{display:block;font-size:13px;margin-top:3px}
.chev{display:inline-block;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:0 2px 2px 8px;transition:transform .15s;flex:none}
[aria-expanded=true]>.chev,[aria-expanded=true] .chev{transform:rotate(-135deg);margin-bottom:-2px}
.pbar{position:relative;display:block;height:16px;margin-top:12px}
.pbar i{position:absolute;display:block}
.pbar .trk{left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--s2)}
.pbar .bseg{top:6px;height:4px}
.pbar .bseg.l{background:var(--loss);opacity:.6} .pbar .bseg.g{background:var(--gain);opacity:.6}
.pbar .tk{top:2px;height:12px;width:2px;transform:translateX(-1px);border-radius:1px;background:var(--ink2)}
.pbar .tk.l{background:var(--loss)} .pbar .tk.g{background:var(--gain)}
.pbar .now{top:1px;width:14px;height:14px;border-radius:50%;transform:translateX(-7px);border:3px solid var(--s1)}
.pbar .now.g{background:var(--gain)} .pbar .now.l{background:var(--loss)} .pbar .now.n{background:var(--ink2)}
.det{padding:2px 16px 14px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.kv>span{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv>span:nth-child(odd){color:var(--ink2)}
.kv>span:nth-child(even){text-align:right;font-weight:600}
.kv>span small{font-weight:500;color:var(--ink2);margin-left:6px}
.inl{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--acc);font-size:14px;font-weight:600;padding:12px 0 4px;text-align:left}
.parts{padding-bottom:4px}
.part{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.hint2{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin-top:10px}
.det .actions{margin-top:14px}
.det .actions .btn{min-height:44px}

/* notes and empty states */
.note{margin:10px 16px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:14px;font-weight:500}
.note p+p{margin-top:6px}
.empty{margin:36px 20px}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{margin-bottom:16px;max-width:34ch;color:var(--ink2)}

/* lists, tables, menu */
.rowitem{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border:0;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;color:inherit}
.rowitem:first-child{border-top:0}
.rowitem h3{font-size:17px}
.rowitem .sub2{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.pl{text-align:right;line-height:1.15;flex:none}
.pl b{display:block;font-size:17px;font-weight:650}
.pl small{font-size:13px}
.menu .mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:550;text-align:left}
.menu .mi:first-child{border-top:0}
.menu .mi small{color:var(--ink2);font-size:13px;font-weight:500}
.menu .mi::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-top:2px solid var(--ink2);transform:rotate(45deg);margin-left:10px;flex:none}
.menu .mi span{flex:1}
.sec{padding:16px 16px 4px}
.sec h2{font-size:18px}
.sec p{font-size:13px;color:var(--ink2);margin-top:3px}
.pad{padding:0 16px}
.hero{padding:16px 18px 8px}
.hero .big{font-size:40px;font-weight:700}
.bars{display:block;width:100%;height:auto}
.bars .bg{fill:var(--gain)} .bars .bl{fill:var(--loss)} .bars .axis{stroke:var(--line2);stroke-width:1}
.bar-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:2px 18px 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--ink2);text-align:right;padding:8px 12px;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 12px;border-top:1px solid var(--line);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.stats>div:nth-child(3n){border-right:0}
.stats>div:nth-child(-n+3){border-top:0}
.stats .v{display:block;font-size:18px;font-weight:650}
.setrow{padding:0 16px 12px}
.setrow.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btnrow{display:flex;flex-direction:column;gap:10px;padding:8px 16px 14px}
.hint{font-size:13px;color:var(--ink2);padding:0 16px 6px}
.pre{font-size:14px;white-space:pre-wrap;word-break:break-word;background:var(--s2);border-radius:10px;padding:10px 12px;margin-top:6px}
.opts{display:grid;gap:10px;padding:4px 16px 8px}
.opt{display:block;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);color:var(--ink)}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.opt[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}

/* tabs, new-trade button */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:15px 0 13px;font-size:15px;font-weight:600;color:var(--ink2);position:relative}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:38%;right:38%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;min-height:50px;padding:0 22px;background:var(--acc);color:var(--on-acc);border:0;border-radius:999px;font-size:16px;font-weight:650;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.fab[hidden]{display:none}

/* bottom sheet */
.veil{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.pane{background:var(--bg);width:100%;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.pane h2{font-size:22px;margin-bottom:2px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.calc{margin-top:14px}
.kv2{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv2>div{padding:9px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.kv2>div:nth-child(3n){border-right:0}
.kv2>div:nth-child(-n+3){border-top:0}
.kv2 .v{display:block;font-size:16px;font-weight:650}
.calc p{font-size:14px;margin-top:8px}
.warnp{color:var(--warn);font-weight:500}
.sg{background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.sg-row{padding:10px 12px;border-top:1px solid var(--line)}
.sg-row:first-child{border-top:0}
.sg-n{display:block;font-weight:600;font-size:15px}
.sg-b{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pickbtn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-size:13px;font-weight:650}
.sg-h{padding:8px 12px;font-size:12px;color:var(--ink2);background:var(--s2)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gain-bg);border-radius:12px;padding:10px 12px;margin-top:8px}
.picked b{display:block;font-size:15px}
.picked small{display:block;color:var(--ink2);font-size:13px}
.status{font-size:13px;margin-top:8px;color:var(--ink2)}
.status.ok{color:var(--gain)} .status.bad{color:var(--warn)}
.leg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.leg .leg-a{grid-column:1/-1;display:flex;gap:8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(122px + env(safe-area-inset-bottom));z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* lock and setup */
.gate{max-width:420px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 24px 40px}
.gate h1{font-size:34px;margin-bottom:10px}
.gate p{color:var(--ink2);margin-bottom:14px}
.gate .btn{width:100%;margin-top:16px}
.gate .link{margin-top:10px}
@media (prefers-reduced-motion: reduce){.pane{animation:none}#toast{transition:none}.chev{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filein" accept=".tbk,application/json,text/plain" hidden>
<script src="companies.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ==CALC-START==
const GROWW_CHARGES={brokCap:20,brokPct:0.1,brokMin:5,brokMinPct:2.5,stt:0.1,nse:0.00297,bse:0.00375,sebi:0.0001,ipft:0.0001,stamp:0.015,gst:18,dp:16.5};
// Zerodha: free delivery brokerage; DP is 13 + 18% GST = 15.34 per scrip per sell day (their own charges page)
const ZERODHA_CHARGES={brokCap:0,brokPct:0,brokMin:0,brokMinPct:0,stt:0.1,nse:0.00297,bse:0.00375,sebi:0.0001,ipft:0,stamp:0.015,gst:18,dp:13};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
function legCharges(side,ex,value,ch,withDP){
  const p=v=>v/100;
  let brok=Math.min(ch.brokCap,value*p(ch.brokPct));
  if(brok<ch.brokMin) brok=Math.min(ch.brokMin,value*p(ch.brokMinPct));
  const c={
    brok:r2(brok),
    stt:r2(value*p(ch.stt)),
    exch:r2(value*p(ex==='BSE'?ch.bse:ch.nse)),
    sebi:r2(value*p(ch.sebi)),
    ipft:ex==='NSE'?r2(value*p(ch.ipft)):0,
    stamp:side==='buy'?r2(value*p(ch.stamp)):0,
    dp:(side==='sell'&&withDP&&value>=100)?r2(ch.dp):0
  };
  c.gst=r2(p(ch.gst)*(c.brok+c.exch+c.sebi+c.ipft+c.dp));
  c.total=r2(c.brok+c.stt+c.exch+c.sebi+c.ipft+c.stamp+c.dp+c.gst);
  return c;
}
const CH_KEYS=['brok','stt','exch','sebi','ipft','stamp','dp','gst','total'];
function sumCharges(list){const o={};CH_KEYS.forEach(k=>{o[k]=r2(list.reduce((s,c)=>s+c[k],0));});return o;}
const buysOf=t=>(t.buys&&t.buys.length)?t.buys:[{price:t.entry,qty:t.qty,date:t.entryDate}];
const avgOf=bs=>{const q=bs.reduce((s,b)=>s+b.qty,0);return q?bs.reduce((s,b)=>s+b.price*b.qty,0)/q:0;};
function tradeCalc(t,ch,ltp){
  const bs=buysOf(t),qty=bs.reduce((s,b)=>s+b.qty,0),avg=avgOf(bs);
  const exits=(t.exits||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const sold=exits.reduce((s,e)=>s+e.qty,0),rem=qty-sold;
  const buy=sumCharges(bs.map(b=>legCharges('buy',t.ex,b.price*b.qty,ch,false)));
  const seen=new Set();
  const legs=exits.map(e=>{
    const first=!seen.has(e.date);seen.add(e.date);
    const sc=legCharges('sell',t.ex,e.price*e.qty,ch,first);
    const buyShare=r2(buy.total*e.qty/qty);
    const gross=r2((e.price-avg)*e.qty);
    const charges=r2(sc.total+buyShare);
    return {e,gross,charges,net:r2(gross-charges),sc,buyShare};
  });
  const grossReal=r2(legs.reduce((s,l)=>s+l.gross,0));
  const chargesReal=r2(legs.reduce((s,l)=>s+l.charges,0));
  const netReal=r2(grossReal-chargesReal);
  const rps=Math.max(0,avg-t.sl);
  const risk=r2(rps*qty),riskRem=r2(rps*rem),open=rem>0;

function statsOf(nets){

    winRate:nets.length?w.length/nets.length*100:0,

/* company search: typo-tolerant, works offline on the bundled list */
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const m=a.length,n=b.length;let pp=null,prev=Array.from({length:n+1},(_,j)=>j),pmn=0;
  for(let i=1;i<=m;i++){
    const cur=[i];let mn=i;
    for(let j=1;j<=n;j++){
      let v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,pp[j-2]+1);
      cur[j]=v;if(v<mn)mn=v;
    }
    if(mn>max&&pmn>max) return max+1;
    pp=prev;prev=cur;pmn=mn;
  }
  return prev[n];
}
const compact=s=>String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
function buildIndex(data){
  return String(data||'').split('\n').filter(Boolean).map(l=>{
    const [s,b,...n]=l.split('|'),name=n.join('|');
    return {s,b,n:name,sl:compact(s),bl:compact(b),nk:compact(name),
      w:name.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean)};
  });
}
function searchLocal(q,idx,limit){
  limit=limit||6;
  const raw=String(q).trim();if(raw.length<2) return [];
  const qs=compact(raw);
  const qw=raw.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const res=[];
  for(const c of idx){
    let sc=0;
    if(c.sl===qs||c.bl===qs) sc=100;
    else if(c.sl&&c.sl.startsWith(qs)) sc=92;
    else if(c.nk.startsWith(qs)) sc=88;
    else if(qw.length>1&&qw.every(w=>c.nk.includes(w))) sc=80;
    else if(c.w.some(x=>x.startsWith(qs))) sc=74;
    else if(c.bl&&c.bl.startsWith(qs)) sc=70;
    else if(qs.length>=3&&(c.nk.includes(qs)||(c.sl&&c.sl.includes(qs)))) sc=60;
    if(sc) res.push([sc-c.n.length/100,c]);
  }
  if(res.length<limit&&qs.length>=4){
    const max=qs.length>=8?2:1;
    for(const c of idx){
      if(res.some(r=>r[1]===c)) continue;
      const dt=lev(qs,c.sl,max);
      let d=Math.min(dt,lev(qs,c.nk.slice(0,qs.length),max));
      for(const w of c.w){const dw=lev(qs,compact(w).slice(0,qs.length),max);if(dw<d)d=dw;}
      if(d<=max) res.push([40-d*5+(dt<=max?4:0)-c.n.length/100,c]);
    }
  }
  res.sort((a,b)=>b[0]-a[0]);
  return res.slice(0,limit).map(r=>({n:r[1].n,s:r[1].s,b:r[1].b}));
}

/* ---------- encryption (AES-GCM, key from PIN via PBKDF2) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function deriveKey(pin,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptJSON(obj,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decryptJSON(p,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},key,unb64(p.ct));
  return JSON.parse(dec.decode(pt));
}
const vaultExists=()=>!!localStorage.getItem(VAULT);
async function saveVault(){
  if(!DB||!KEY) return;
  const p=await encryptJSON(DB,KEY);
  localStorage.setItem(VAULT,JSON.stringify({v:1,iter:ITER,salt:b64(SALT),iv:p.iv,ct:p.ct}));
}

async function createVault(pin,data){
  SALT=crypto.getRandomValues(new Uint8Array(16));
  KEY=await deriveKey(pin,SALT,ITER);
  DB=migrate(data||defaultDB());

}
async function unlock(pin){
  const raw=JSON.parse(localStorage.getItem(VAULT)),salt=unb64(raw.salt);
  const key=await deriveKey(pin,salt,raw.iter||ITER);
  try{DB=migrate(await decryptJSON(raw,key));}catch(e){return false;}
  KEY=key;SALT=salt;return true;
}

  if(ltp>0) h+='<i class="now '+(ltp>entry?'g':ltp<entry?'l':'n')+'" style="left:'+pos(ltp).toFixed(2)+'%"></i>';
  return h+'</span>';

function barChart(items){
  if(!items.length) return '';
  const W=320,H=116,mid=H/2,pd=6,step=(W-pd*2)/items.length,bw=Math.min(30,step-4);
  const max=Math.max(...items.map(i=>Math.abs(i.net)),1);
  const bars=items.map((it,i)=>{
    const h=Math.max(1,Math.abs(it.net)/max*(mid-10)),x=pd+i*step+(step-bw)/2,y=it.net>=0?mid-h:mid;
    return '<rect class="'+(it.net>=0?'bg':'bl')+'" rx="2" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'"></rect>';
  }).join('');
  return '<svg class="bars" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Net P&amp;L by period">'+bars+'<line class="axis" x1="0" x2="'+W+'" y1="'+mid+'" y2="'+mid+'"></line></svg>';
}
function viewPnl(){
  const all=byBroker(derived()),m=realisedBy(all,pnlMode);
  const keys=Object.keys(m).sort(),cur=periodKey(today(),pnlMode);
  const heroL={day:'Today',week:'This week',month:'This month',year:'This year'}[pnlMode],curNet=(m[cur]||{net:0}).net;
  let h=brokerChips()+'<div class="tog" style="margin-top:10px">'+[['day','Daily'],['week','Weekly'],['month','Monthly'],['year','Yearly']].map(f=>'<button data-act="pnlmode" data-v="'+f[0]+'" aria-pressed="'+(pnlMode===f[0])+'">'+f[1]+'</button>').join('')+'</div>';
  h+='<section class="card"><div class="hero"><span class="k">'+heroL+', after charges</span><span class="big '+cls(curNet)+'">'+sg(curNet,0)+'</span></div>';
  const recent=keys.slice(-12).map(k=>({label:k,net:m[k].net}));
  if(recent.length) h+=barChart(recent)+'<div class="bar-ends"><span>'+esc(periodLabel(recent[0].label,pnlMode))+'</span><span>'+esc(periodLabel(recent[recent.length-1].label,pnlMode))+'</span></div>';
  h+='</section>';
  if(keys.length){
    h+='<section class="card"><table><thead><tr><th scope="col">Period</th><th scope="col">Gross</th><th scope="col">Charges</th><th scope="col">Net</th></tr></thead><tbody>'+
      keys.slice().reverse().map(k=>'<tr><td>'+esc(periodLabel(k,pnlMode))+'</td><td>'+money(m[k].gross,0)+'</td><td>'+money(m[k].charges,0)+'</td><td class="'+cls(m[k].net)+'"><b>'+sg(m[k].net,0)+'</b></td></tr>').join('')+'</tbody></table></section>';
  }else h+='<div class="empty"><h2>No booked P&amp;L yet</h2><p>Profit and loss appears here as you log exits.</p></div>';
  const closed=all.filter(x=>!x.c.open&&x.c.legs.length);
  if(closed.length){
    const s=statsOf(closed.map(x=>x.c.netReal)),tc=r2(all.reduce((a,x)=>a+x.c.chargesReal,0));
    const cell=(k,v,c)=>'<div><span class="k">'+k+'</span><span class="v '+(c||'')+'">'+v+'</span></div>';
    h+='<div class="sec"><h2>All closed trades</h2></div><section class="card"><div class="stats">'+
      cell('Trades',s.n)+cell('Win rate',s.winRate.toFixed(0)+'%')+cell('Profit factor',s.pf===Infinity?'∞':s.pf.toFixed(2))+
      cell('Average win',rs(s.avgWin,0),'gain')+cell('Average loss',rs(Math.abs(s.avgLoss),0),'loss')+cell('Per trade',sg(s.exp,0),cls(s.exp))+
      cell('Best trade',rs(s.best,0),'gain')+cell('Worst trade',sg(s.worst,0),'loss')+cell('Charges paid',rs(tc,0))+'</div></section>';
    const su={};closed.forEach(x=>{const k=x.t.setup||'No setup',o=su[k]||(su[k]={n:0,w:0,net:0});o.n++;if(x.c.netReal>0)o.w++;o.net+=x.c.netReal;});
    h+='<div class="sec"><h2>By setup</h2><p>Which kind of trade actually makes money.</p></div><section class="card"><table><thead><tr><th scope="col">Setup</th><th scope="col">Trades</th><th scope="col">Win</th><th scope="col">Net</th></tr></thead><tbody>'+
      Object.entries(su).sort((a,b)=>b[1].net-a[1].net).map(([k,o])=>'<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td>'+Math.round(o.w/o.n*100)+'%</td><td class="'+cls(o.net)+'">'+sg(o.net,0)+'</td></tr>').join('')+'</tbody></table></section>';
    const mk={};all.forEach(x=>x.c.legs.forEach(l=>(l.e.mistakes||[]).forEach(k=>{const o=mk[k]||(mk[k]={n:0,net:0});o.n++;o.net+=l.net;})));
    if(Object.keys(mk).length) h+='<div class="sec"><h2>Mistakes</h2><p>Net result of the exits you tagged with each mistake.</p></div><section class="card"><table><thead><tr><th scope="col">Mistake</th><th scope="col">Times</th><th scope="col">Net</th></tr></thead><tbody>'+
      Object.entries(mk).sort((a,b)=>a[1].net-b[1].net).map(([k,o])=>'<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td class="'+cls(o.net)+'">'+sg(o.net,0)+'</td></tr>').join('')+'</tbody></table></section>';
  }
  return h;
}

async function onGate(e){

      f.n++;if(f.n>=5)f.until=now+Math.min(900,30*Math.pow(2,f.n-5))*1000;

function calcPreview(f){
  const v=readTrade(f),box=$('#calc'),S=DB.settings;
  if(!(v.entry>0&&v.sl>0&&v.tgt>0)){box.innerHTML='<p class="muted">Enter entry, stop-loss and target to see risk and reward.</p>';return;}
  const rps=v.entry-v.sl,q=v.qty>0?v.qty:0;let h='';
  if(!(rps>0)) h+='<p class="warnp">Stop-loss is at or above the entry price.</p>';
  if(!(v.tgt>v.entry)) h+='<p class="warnp">Target is at or below the entry price.</p>';
  if(rps>0){
    const sug=S.riskPerTrade>0?Math.floor(S.riskPerTrade/rps):0,rr=(v.tgt-v.entry)/rps,tr=rps*q;
    h+='<div class="kv2"><div><span class="k">Risk per share</span><span class="v">'+rs(rps)+'</span></div><div><span class="k">Reward to risk</span><span class="v">1 : '+(rr>0?rr.toFixed(2):'0')+'</span></div><div><span class="k">Total risk</span><span class="v">'+(q?rs(tr,0):'—')+'</span></div>';
    if(q&&v.tgt>v.entry){
      const base={ex:v.ex,entry:v.entry,qty:q,sl:v.sl},d=v.date||today(),ch=S.brokers[v.broker].charges;
      const nt=tradeCalc({...base,exits:[{id:'a',date:d,price:v.tgt,qty:q}]},ch,0).netReal,ns=tradeCalc({...base,exits:[{id:'b',date:d,price:v.sl,qty:q}]},ch,0).netReal;
      h+='<div><span class="k">Net at target</span><span class="v gain">'+sg(nt,0)+'</span></div><div><span class="k">Net at stop-loss</span><span class="v loss">'+sg(ns,0)+'</span></div><div><span class="k">Cost of shares</span><span class="v">'+rs(v.entry*q,0)+'</span></div>';
    }
    h+='</div>';
    if(q&&S.capital>0) h+='<p class="muted">Risks '+(tr/S.capital*100).toFixed(2)+'% of your capital.</p>';
    if(sug>0) h+='<p>Your risk setting is '+rs(S.riskPerTrade,0)+', which suggests '+sug+' shares. <button type="button" class="link" data-act="usesug" data-q="'+sug+'">Use '+sug+'</button></p>';

async function saveTrade(f,t,getPick){

  const reasons=REASONS.map(r=>'<option'+(ex&&ex.reason===r?' selected':'')+'>'+r+'</option>').join('');
  const mk=DB.tags.mistakes.map(m=>'<label class="chipcheck"><input type="checkbox" name="mk" value="'+esc(m)+'"'+(ex&&(ex.mistakes||[]).includes(m)?' checked':'')+'><span>'+esc(m)+'</span></label>').join('');
  openSheet('<h2>'+(ex?'Edit exit':'Log exit')+', '+esc(t.sym)+'</h2><p class="muted">Average cost '+rs(c.avg)+'. '+maxQ+' can still be sold.</p><form id="xf" autocomplete="off">'+
    '<div class="row2"><div><label for="x-price">Exit price</label><input id="x-price" name="price" inputmode="decimal" value="'+dp+'"></div><div><label for="x-qty">Quantity sold</label><input id="x-qty" name="qty" inputmode="numeric" value="'+(ex?ex.qty:maxQ)+'"></div></div>'+
    '<div class="row2"><div><label for="x-date">Exit date</label><input id="x-date" type="date" name="date" value="'+(ex?ex.date:today())+'" min="'+t.entryDate+'" max="'+today()+'"></div><div><label for="x-reason">Reason</label><select id="x-reason" name="reason">'+reasons+'</select></div></div>'+
    '<div class="calc" id="xprev" aria-live="polite"></div><label>Mistakes, if any</label><div class="chips">'+mk+'</div>'+
    '<label for="x-note">Note</label><textarea id="x-note" name="note" rows="2">'+esc(ex?ex.note:'')+'</textarea>'+
    '<p class="err" id="err" role="alert"></p><div class="actions"><button type="button" class="btn" data-act="closesheet">Cancel</button><button class="btn pri" type="submit">Save exit</button></div></form>');
  const f=$('#xf');
  const prev=()=>{
    const price=num(f.elements.price.value),qty=Math.floor(num(f.elements.qty.value)),date=f.elements.date.value,box=$('#xprev');
    if(!(price>0&&qty>0&&date)){box.innerHTML='';return;}
    const others=t.exits.filter(x=>x.id!==eid);
    const a=tradeCalc({...t,exits:others},ch,0),b=tradeCalc({...t,exits:[...others,{id:'_',date,price,qty}]},ch,0);
    const g=r2(b.grossReal-a.grossReal),cg=r2(b.chargesReal-a.chargesReal),n=r2(b.netReal-a.netReal);
    box.innerHTML='<div class="kv2"><div><span class="k">Gross</span><span class="v '+cls(g)+'">'+sg(g)+'</span></div><div><span class="k">Charges</span><span class="v">'+rs(cg)+'</span></div><div><span class="k">Net</span><span class="v '+cls(n)+'">'+sg(n)+'</span></div></div>';
  };
  f.addEventListener('input',prev);prev();
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const err=$('#err'),price=num(f.elements.price.value),qty=Math.floor(num(f.elements.qty.value)),date=f.elements.date.value;
    if(!(price>0)){err.textContent='Enter the exit price.';return;}
    if(!(qty>0)||qty>maxQ){err.textContent='Quantity must be between 1 and '+maxQ+'.';return;}
    if(!date||date<t.entryDate||date>today()){err.textContent='Pick a date between the entry date and today.';return;}
    const rec={id:ex?ex.id:uid(),date,price,qty,reason:f.elements.reason.value,mistakes:$$('input[name=mk]:checked',f).map(x=>x.value),note:f.elements.note.value.trim()};
    if(ex) t.exits[t.exits.findIndex(x=>x.id===eid)]=rec;else t.exits.push(rec);
    try{await saveVault();}catch(x){err.textContent='Could not save: '+x.message;return;}
    closeSheet();toast(qty>=maxQ?'Trade closed':'Partial exit logged');renderMain();
  });
}
function detailSheet(id){
  const t=findTrade(id),p=DB.prices[pkey(t)],c=tradeCalc(t,chOf(t),p?p.ltp:0);
  const K=[['brok','Brokerage'],['stt','STT'],['exch','Exchange fee'],['sebi','SEBI fee'],['ipft','Investor protection'],['stamp','Stamp duty'],['dp','DP charge'],['gst','GST']];
  const part=c.sold/c.qty,sum={};
  K.forEach(k=>{sum[k[0]]=r2(c.buy[k[0]]*part+c.legs.reduce((s,l)=>s+l.sc[k[0]],0));});
  let h='<h2>'+esc(t.sym)+' <span class="chip">'+t.ex+'</span> <span class="chip">'+esc(BROKERS[brokerOf(t)])+'</span></h2><p class="muted">'+(t.name?esc(t.name)+'. ':'')+'Average price '+rs(c.avg)+' for '+c.qty+' shares'+(t.setup?', setup: '+esc(t.setup):'')+'</p>';
  h+='<section class="card" style="margin:12px 0"><div class="stats"><div><span class="k">Stop-loss</span><span class="v loss">'+money(t.sl)+'</span></div><div><span class="k">Target</span><span class="v gain">'+money(t.tgt)+'</span></div><div><span class="k">Planned risk</span><span class="v">'+rs(c.risk,0)+'</span></div>';
  h+='<div><span class="k">Booked net</span><span class="v '+cls(c.netReal)+'">'+(c.legs.length?sg(c.netReal):'—')+'</span></div><div><span class="k">Charges</span><span class="v">'+(c.legs.length?rs(c.chargesReal):'—')+'</span></div><div><span class="k">'+(c.open?'Open P&amp;L':'Result in R')+'</span><span class="v '+(c.open?cls(c.unreal||0):cls(c.netReal))+'">'+(c.open?(c.unreal==null?'—':sg(c.unreal,0)):(c.rMult==null?'—':c.rMult.toFixed(2)+'R'))+'</span></div></div></section>';
  if(t.notes) h+='<label>Why this trade</label><div class="pre">'+esc(t.notes)+'</div>';
  h+='<label>Buys</label>'+t.buys.slice().sort((a,b)=>a.date<b.date?-1:1).map(b=>'<div class="leg"><div><b>'+dShort(b.date)+'</b>, bought '+b.qty+' at '+money(b.price)+'</div><div class="pl"><b>'+rs(b.price*b.qty,0)+'</b></div><div class="leg-a"><button class="link" data-act="editbuy" data-id="'+t.id+'" data-bid="'+b.id+'">Edit</button>'+(t.buys.length>1?'<button class="link danger" data-act="delbuy" data-id="'+t.id+'" data-bid="'+b.id+'">Delete</button>':'')+'</div></div>').join('');
  h+='<label>Exits</label>';
  h+=c.legs.length?c.legs.map(l=>'<div class="leg"><div><b>'+dShort(l.e.date)+'</b>, sold '+l.e.qty+' at '+money(l.e.price)+'<br><span class="muted">'+esc(l.e.reason||'')+((l.e.mistakes||[]).length?', mistakes: '+l.e.mistakes.map(esc).join(', '):'')+'</span>'+(l.e.note?'<br><span class="muted">'+esc(l.e.note)+'</span>':'')+'</div><div class="pl '+cls(l.net)+'"><b>'+sg(l.net)+'</b><small>after '+rs(l.charges)+' charges</small></div><div class="leg-a"><button class="link" data-act="editexit" data-id="'+t.id+'" data-eid="'+l.e.id+'">Edit</button><button class="link danger" data-act="delexit" data-id="'+t.id+'" data-eid="'+l.e.id+'">Delete</button></div></div>').join(''):'<p class="muted">No exits logged yet.</p>';
  if(c.legs.length) h+='<label>Charges on the part sold</label><section class="card" style="margin:0"><table><tbody>'+K.filter(k=>sum[k[0]]>0).map(k=>'<tr><td>'+k[1]+'</td><td>'+rs(sum[k[0]])+'</td></tr>').join('')+'<tr><td><b>Total</b></td><td><b>'+rs(c.chargesReal)+'</b></td></tr></tbody></table></section>';
  h+='<div class="actions">'+(c.open?'<button class="btn pri" data-act="exit" data-id="'+t.id+'">Log exit</button><button class="btn" data-act="addmore" data-id="'+t.id+'">Add more</button>':'')+'<button class="btn" data-act="edit" data-id="'+t.id+'">Edit trade</button></div><div class="actions"><button class="btn danger" data-act="deltrade" data-id="'+t.id+'">Delete trade</button><button class="btn" data-act="closesheet">Close</button></div>';
  openSheet(h);
}
function pinSheet(title,text,fields,onSubmit,label){
  openSheet('<h2>'+title+'</h2><p class="muted">'+text+'</p><form id="pf" autocomplete="off">'+fields.map((f,i)=>'<label for="pf'+i+'">'+f+'</label><input id="pf'+i+'" type="password" inputmode="numeric" autocomplete="off" maxlength="12">').join('')+'<p class="err" id="err" role="alert"></p><div class="actions"><button type="button" class="btn" data-act="closesheet">Cancel</button><button class="btn pri" type="submit">'+label+'</button></div></form>');
  $('#pf').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';try{await onSubmit($$('#pf input').map(i=>i.value));}catch(x){$('#err').textContent=x.message;}});
}

/* ---------- backup, restore, export ---------- */
function download(name,text,type){
  const u=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},2000);
}
async function doBackup(){
  DB.settings.lastBackup=Date.now();await saveVault();
  download('tradebook-'+today()+'.tbk',localStorage.getItem(VAULT),'application/json');
  toast('Backup saved. It is encrypted with your PIN.');
  renderMain();
}
function csvCell(v){
  if(typeof v==='string'&&/^[=+\-@\t\r]/.test(v)) v="'"+v;
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function doCSV(){
  const rows=[['Symbol','Company','Exchange','Broker','Status','Setup','First buy date','Average entry','Quantity','Buys','Stop-loss','Target','Exit date','Exit price','Exit quantity','Gross P&L','Charges','Net P&L','Exit reason','Mistakes','Notes']];
  derived().forEach(({t,c})=>{
    const base=[t.sym,t.name,t.ex,BROKERS[brokerOf(t)],c.open?'Open':'Closed',t.setup||'',t.entryDate,r2(c.avg),c.qty,t.buys.map(b=>b.date+' '+b.qty+'@'+b.price).join('; '),t.sl,t.tgt];
    if(!c.legs.length) rows.push(base.concat(['','','','','','','','',t.notes||'']));
    else c.legs.forEach(l=>rows.push(base.concat([l.e.date,l.e.price,l.e.qty,l.gross,l.charges,l.net,l.e.reason||'',(l.e.mistakes||[]).join('; '),t.notes||''])));
  });
  download('tradebook-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
  toast('CSV saved. It is not encrypted.');
}
function restoreFlow(raw){
  let v;
  try{v=JSON.parse(raw);if(!(v.salt&&v.iv&&v.ct))throw 0;}catch(e){toast('That file is not a Trade Book backup.');return;}
  pinSheet('Restore backup','Enter the PIN that was set when this backup was saved.',['Backup PIN'],async vals=>{
    const key=await deriveKey(vals[0],unb64(v.salt),v.iter||ITER);
    let data;try{data=await decryptJSON(v,key);}catch(e){throw new Error('That PIN does not open this backup.');}
    if(vaultExists()){
      if(!KEY||!DB) throw new Error('Unlock the app first, then restore.');
      DB=migrate(data);await saveVault();
    }else await createVault(vals[0],data);
    closeSheet();toast('Backup restored');afterUnlock();
  },'Restore');
}
async function testFeed(){
  const t=DB.trades.find(isOpenT),yf=t?pkey(t):'RELIANCE.NS';
  openSheet('<h2>Price feed test</h2><p class="muted">Checking '+esc(yf)+' by each route.</p><div id="tres"></div><div class="actions"><button class="btn" data-act="closesheet">Close</button></div>');
  const out=$('#tres'),line=(a,b)=>{out.insertAdjacentHTML('beforeend','<div class="pre"><b>'+a+'</b><br>'+b+'</div>');};
  if(DB.settings.source==='custom'&&DB.settings.customUrl){
    const t0=Date.now();
    try{const q=await quoteCustom(t||{sym:'RELIANCE',ex:'NSE'});line('Your own link works','Price '+money(q.ltp)+', '+(Date.now()-t0)+' ms, '+esc(ageInfo({ltp:q.ltp,t:q.t}).txt)+'.');}catch(e){line('Your own link failed',esc(friendlyErr(e)));}
    return;
  }
  for(const r of ROUTES){
    const t0=Date.now();
    try{const q=parseYahoo(await fetchJSON(r.f(YQ(yf))));const a=ageInfo({ltp:q.ltp,t:q.t});line(r.name+' works','Price '+money(q.ltp)+', reply in '+(Date.now()-t0)+' ms. Price time: '+esc(a.txt)+(marketOpen()?'.':'. The market is closed, so this is the last close.'));}
    catch(e){line(r.name+' failed',esc(friendlyErr(e)));}
  }
}

/* ---------- events ---------- */
function rerenderCard(id){
  const x=derived().find(d=>d.t.id===id),el=$('[data-card="'+id+'"]');
  if(x&&el){el.outerHTML=posCard(x,computeAlerts().find(a=>a.t.id===id));const b=$('[data-card="'+id+'"] .pos-h');if(b)b.focus();}
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el) return;
  const a=el.dataset.act,id=el.dataset.id,f=$('#tf');
  try{
    switch(a){
      case 'tabhome':if(page!=='home')go('home');break;
      case 'go':go(el.dataset.p);break;
      case 'back':back();break;
      case 'togglecard':if(expanded.has(id))expanded.delete(id);else expanded.add(id);rerenderCard(id);break;
      case 'togglebuys':if(buysOpen.has(id))buysOpen.delete(id);else buysOpen.add(id);rerenderCard(id);break;
      case 'new':tradeSheet();break;
      case 'refresh':refreshPrices();break;
      case 'lock':await saveVault();lock();break;
      case 'exit':exitSheet(id);break;
      case 'addmore':buySheet(id);break;
      case 'editbuy':buySheet(id,el.dataset.bid);break;
      case 'delbuy':{
        const t=findTrade(id),b=t.buys.find(x=>x.id===el.dataset.bid),sold=t.exits.reduce((s,x)=>s+x.qty,0);
        if(t.qty-b.qty<sold){toast('That would leave fewer shares than the '+sold+' already sold.');break;}
        if(confirm('Delete this buy?')){t.buys=t.buys.filter(x=>x.id!==b.id);syncTrade(t);await saveVault();detailSheet(id);renderMain();}
        break;}
      case 'editexit':exitSheet(id,el.dataset.eid);break;
      case 'delexit':if(confirm('Delete this exit?')){const t=findTrade(id);t.exits=t.exits.filter(x=>x.id!==el.dataset.eid);await saveVault();detailSheet(id);renderMain();}break;
      case 'detail':detailSheet(id);break;
      case 'edit':tradeSheet(id);break;
      case 'deltrade':if(confirm('Delete this trade and all its buys and exits? This cannot be undone.')){DB.trades=DB.trades.filter(t=>t.id!==id);await saveVault();closeSheet();renderMain();toast('Trade deleted');}break;
      case 'closesheet':closeSheet();break;
      case 'pick':{const c=f._sugg(+el.dataset.i);if(c)f._choose(c,el.dataset.x);break;}
      case 'unpick':f._unpick();break;
      case 'usetyped':f._typed();break;
      case 'usesug':f.elements.qty.value=el.dataset.q;f.elements.qty.dispatchEvent(new Event('input',{bubbles:true}));break;
      case 'setprice':{
        const k=el.dataset.key,cur=DB.prices[k],v=prompt('Enter the current price for '+k.split('.')[0],cur&&cur.ltp?cur.ltp:'');
        if(v!==null&&num(v)>0){DB.prices[k]={ltp:num(v),t:Date.now(),f:Date.now(),manual:true};await saveVault();runAlerts();renderMain();}
        break;}
      case 'pnlmode':pnlMode=el.dataset.v;renderMain();break;
      case 'brokerf':brokerF=el.dataset.v;renderMain();break;
      case 'bookf':bookF.r=el.dataset.v;renderMain();break;
      case 'theme':setLook('theme',el.dataset.v);renderMain();break;
      case 'font':setLook('font',el.dataset.v);renderMain();break;
      case 'backup':await doBackup();break;
      case 'csv':doCSV();break;
      case 'restore':$('#filein').value='';$('#filein').click();break;
      case 'changepin':
        pinSheet('Change PIN','Your data is re-encrypted with the new PIN.',['Current PIN','New PIN (6 to 12 digits)','New PIN again'],async v=>{
          const raw=JSON.parse(localStorage.getItem(VAULT));
          try{await decryptJSON(raw,await deriveKey(v[0],unb64(raw.salt),raw.iter||ITER));}catch(x){throw new Error('Current PIN is not correct.');}
          if(!/^\d{6,12}$/.test(v[1])) throw new Error('Use 6 to 12 digits.');
          if(v[1]!==v[2]) throw new Error('The new PINs do not match.');
          SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(v[1],SALT,ITER);await saveVault();
          closeSheet();toast('PIN changed. Save a new backup so it matches.');
        },'Change PIN');break;
      case 'forgot':if(prompt('This erases the trade book on this phone so you can restore a backup. Type ERASE to continue.')==='ERASE'){localStorage.removeItem(VAULT);localStorage.removeItem(FAILS);render();}break;
      case 'erase':if(prompt('This deletes every trade on this phone. Type ERASE to confirm.')==='ERASE'){localStorage.removeItem(VAULT);localStorage.removeItem(FAILS);DB=null;KEY=null;lock();}break;
      case 'resetcharges':DB.settings.brokers[el.dataset.b].charges={...(el.dataset.b==='groww'?GROWW_CHARGES:ZERODHA_CHARGES)};await saveVault();renderMain();toast(BROKERS[el.dataset.b]+' charges reset');break;
      case 'testfeed':await testFeed();break;
      case 'notif':
        if(!('Notification' in window)){toast('This browser does not support notifications.');break;}
        toast((await Notification.requestPermission())==='granted'?'Notifications are on.':'Notifications were not allowed.');break;
    }
  }catch(x){toast('Something went wrong: '+x.message);}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='filein'){
    const fl=el.files&&el.files[0];if(!fl) return;
    const r=new FileReader();r.onload=()=>restoreFlow(String(r.result));r.readAsText(fl);return;
  }
  if(!DB) return;
  if(el.dataset.set){
    const path=el.dataset.set,S=DB.settings;let v=el.value;
    if(el.dataset.type==='num'){v=num(v);if(path==='capital'&&el.value.trim()==='')v=0;if(!(v>=0)){toast('Enter a valid number.');renderMain();return;}}
    const parts=path.split('.');let o=S;while(parts.length>1)o=o[parts.shift()];o[parts[0]]=v;
    await saveVault();
    if(path==='source'||path==='defaultBroker') renderMain();
  }else if(el.dataset.tags){
    const list=[...new Set(el.value.split(',').map(s=>s.trim()).filter(Boolean))];
    if(!list.length){toast('Keep at least one tag.');renderMain();return;}
    DB.tags[el.dataset.tags]=list;await saveVault();toast('Tags saved');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='bq'){bookF.q=e.target.value;$('#booklist').innerHTML=bookList();}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(DB&&hiddenAt&&Date.now()-hiddenAt>=DB.settings.autoLock*1000){hiddenAt=0;lock();return;}
  hiddenAt=0;if(DB){refreshPrices();updateFeed();}
});
setInterval(()=>{if(DB&&!document.hidden&&marketOpen())refreshPrices();},30000);
setInterval(()=>{if(DB&&!document.hidden)updateFeed();},5000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!DB)location.reload();had=true;});
}
render();
</script>
